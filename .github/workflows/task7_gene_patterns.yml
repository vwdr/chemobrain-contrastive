name: Task 7 robust gene-pattern audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/19_gene_pattern_audit.py"
      - "requirements-task4.txt"
      - ".github/workflows/task7_gene_patterns.yml"

jobs:
  gene-patterns:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research.txt
          python -m pip install -r requirements-task4.txt
          python -m pip install requests

      - name: Download public cohort inputs
        run: python scripts/05_download_research_data.py

      - name: Recover corrected cohort
        run: python scripts/05_recover_cohort.py

      - name: Verify recovered data hash
        run: |
          ACTUAL=$(sha256sum data/processed/recovered_counts.h5ad | awk '{print $1}')
          EXPECTED="62a5047e74d4ea704f2a10b5b91b35a4836ccefc99186d4c72101db78cbd8ac1"
          echo "Actual:   $ACTUAL"
          echo "Expected: $EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - name: Regenerate paired Task 4 pseudobulk support
        run: python scripts/16_pseudobulk_paired.py

      - name: Download pinned mouse MSigDB gene sets
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, requests

          base = "https://data.broadinstitute.org/gsea-msigdb/msigdb/release/2025.1.Mm/"
          names = [
              "m2.cp.reactome.v2025.1.Mm.symbols.gmt",
              "m5.go.bp.v2025.1.Mm.symbols.gmt",
              "m8.all.v2025.1.Mm.symbols.gmt",
          ]
          out = Path("data/evidence")
          out.mkdir(parents=True, exist_ok=True)
          for name in names:
              url = base + name
              r = requests.get(url, timeout=180)
              r.raise_for_status()
              path = out / name
              path.write_bytes(r.content)
              print(name, len(r.content), hashlib.sha256(r.content).hexdigest())
          PY

      - name: Run Task 7 audit
        run: python scripts/19_gene_pattern_audit.py

      - name: Show Task 7 results
        run: |
          echo "===== CROSS VALIDATION ====="
          cat analysis/corrected_20260920/task7_cross_validation_summary.csv
          echo
          echo "===== ENRICHMENT SUMMARY ====="
          cat analysis/corrected_20260920/task7_enrichment_summary.csv
          echo
          echo "===== TOP TERMS ====="
          cat analysis/corrected_20260920/task7_top_enrichment_terms.csv
          echo
          echo "===== ZERO-BASELINE PATHWAY ROBUSTNESS ====="
          cat analysis/corrected_20260920/task7_pathway_robustness_summary.csv
          echo
          echo "===== DESIGN ====="
          cat analysis/corrected_20260920/task7_gene_pattern_design.json

      - name: Sanity checks
        run: |
          python - <<'PY'
          import pandas as pd

          g = pd.read_csv(
              "analysis/corrected_20260920/task7_consensus_genes.csv"
          )
          assert g.groupby("axis").size().to_dict() == {
              "cisplatin": 33,
              "doxorubicin": 20,
              "shared": 34,
          }

          x = pd.read_csv(
              "analysis/corrected_20260920/task7_cross_validation_summary.csv"
          )
          assert len(x) == 3
          assert dict(zip(x.axis, x.n_overlap_cisplatin_DE_unique_genes)) == {
              "shared": 7,
              "doxorubicin": 2,
              "cisplatin": 5,
          }

          de = pd.read_csv(
              "analysis/corrected_20260920/task7_cis_pseudobulk_gene_support.csv"
          )
          universe = set(pd.read_csv(
              "analysis/corrected_20260920/benchmark_gene_universe.csv"
          ).gene.astype(str))
          robust_de = set(
              de.loc[de.supported_de_gene, "gene"].astype(str)
          ) & universe
          assert len(robust_de) == 68

          e = pd.read_csv(
              "analysis/corrected_20260920/task7_consensus_enrichment.csv"
          )
          assert set(e.library) == {"Reactome", "GO_BP", "M8_cell_type"}
          assert set(e.axis) == {"shared", "doxorubicin", "cisplatin"}
          assert ((e.q_value >= 0) & (e.q_value <= 1)).all()

          print("PASS Task 7 gene-pattern output checks")
          PY

      - name: Collect Task 7 outputs
        if: always()
        run: |
          mkdir -p task7_gene_patterns
          for f in             task7_consensus_genes.csv             task7_cross_validation_summary.csv             task7_cis_pseudobulk_gene_support.csv             task7_consensus_enrichment.csv             task7_top_enrichment_terms.csv             task7_enrichment_summary.csv             task7_pathway_robustness_summary.csv             task7_gene_pattern_design.json
          do
            if [ -f "analysis/corrected_20260920/$f" ]; then
              cp "analysis/corrected_20260920/$f" task7_gene_patterns/
            fi
          done
          cp data/evidence/m8.all.v2025.1.Mm.symbols.gmt task7_gene_patterns/ || true

      - name: Upload Task 7 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task7-gene-patterns
          path: task7_gene_patterns/
          retention-days: 7