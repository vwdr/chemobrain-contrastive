name: Task 1 corrected latent usage robustness audit

on:
  workflow_dispatch:

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        replicate: [1, 2, 3]

    runs-on: ubuntu-24.04

    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
      TASK1_REPLICATE: ${{ matrix.replicate }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research.txt

      - name: Show hardware and package versions
        run: |
          echo "===== RUNNER ====="
          uname -a
          echo
          echo "===== CPU ====="
          lscpu | grep -E 'Architecture|Vendor ID|Model name|CPU family|Model:|Stepping|Flags' || true
          echo
          echo "===== PYTHON ENVIRONMENT ====="
          python - <<'PY'
          import platform
          import torch, numpy, pandas, scanpy, anndata, sklearn
          print("Platform:", platform.platform())
          print("Machine:", platform.machine())
          print("Python:", platform.python_version())
          print("Torch:", torch.__version__)
          print("NumPy:", numpy.__version__)
          print("Pandas:", pandas.__version__)
          print("Scanpy:", scanpy.__version__)
          print("AnnData:", anndata.__version__)
          print("scikit-learn:", sklearn.__version__)
          PY

      - name: Download public inputs
        run: python scripts/05_download_research_data.py

      - name: Recover corrected cohort
        run: python scripts/05_recover_cohort.py

      - name: Verify recovered data hash
        run: |
          ACTUAL=$(sha256sum data/processed/recovered_counts.h5ad | awk '{print $1}')
          EXPECTED="62a5047e74d4ea704f2a10b5b91b35a4836ccefc99186d4c72101db78cbd8ac1"
          echo "Actual:   $ACTUAL"
          echo "Expected: $EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - name: Prepare benchmark split
        run: python scripts/06_validation.py --prepare

      - name: Rebuild benchmark with committed gene universe
        run: |
          cp runs/corrected_20260920/inputs.npz /tmp/prepared_inputs.npz
          git restore analysis/corrected_20260920/benchmark_gene_universe.csv

          python - <<'PY'
          import numpy as np
          import pandas as pd
          import anndata as ad
          import scanpy as sc

          run = "runs/corrected_20260920"
          genes = pd.read_csv(
              "analysis/corrected_20260920/benchmark_gene_universe.csv"
          )["gene"].astype(str).tolist()

          old = np.load("/tmp/prepared_inputs.npz")
          train = old["train"].copy()
          val = old["val"].copy()
          test = old["test"].copy()

          a = ad.read_h5ad("data/processed/recovered_counts.h5ad")
          obs = a.obs.copy()

          missing = [g for g in genes if g not in a.var_names]
          assert not missing, f"Missing committed genes: {missing}"

          counts = a[:, genes].X.toarray().astype("float32")
          library = np.asarray(a.X.sum(1)).ravel().astype("float32")
          np.savez_compressed(
              f"{run}/count_inputs.npz",
              C=counts,
              library=library,
          )

          sc.pp.normalize_total(a, target_sum=1e4)
          sc.pp.log1p(a)
          X = a[:, genes].X.toarray().astype("float32")

          d = obs.drug.map({
              "control": 0,
              "doxorubicin": 1,
              "cisplatin": 2,
          }).values.astype("int64")
          b = (obs.study == "GSE271055").values.astype("int64")

          np.savez_compressed(
              f"{run}/inputs.npz",
              X=X,
              d=d,
              b=b,
              train=train,
              val=val,
              test=test,
              genes=np.asarray(genes, dtype="U"),
          )

          print("X shape:", X.shape)
          print("Canonical genes:", len(genes))
          print("Train/val/test:", len(train), len(val), len(test))
          assert X.shape == (46857, 1500)
          assert len(genes) == 1500
          assert len(train) == 6000
          assert len(val) == 2881
          assert len(test) == 2881
          PY

      - name: Train full models for seeds 0 1 2
        run: |
          for seed in 0 1 2; do
            echo "===== TRAINING SEED $seed ====="
            python scripts/06_validation.py --mode full --seed "$seed" --epochs 100
          done

      - name: Compare with committed metrics
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import subprocess

          rep = int(os.environ["TASK1_REPLICATE"])
          rows = []

          for seed in (0, 1, 2):
              path = f"runs/corrected_20260920/full_{seed}_metrics.json"
              with open(path) as f:
                  new = json.load(f)

              old = json.loads(
                  subprocess.check_output(
                      ["git", "show", f"HEAD:{path}"],
                      text=True,
                  )
              )

              row = {
                  "runner_replicate": rep,
                  "seed": seed,
                  "committed_shared_fraction": old["shared_fraction"],
                  "new_shared_fraction": new["shared_fraction"],
                  "shared_fraction_delta": new["shared_fraction"] - old["shared_fraction"],
                  "committed_test_mse": old["test_mse"],
                  "new_test_mse": new["test_mse"],
                  "test_mse_delta": new["test_mse"] - old["test_mse"],
                  "canonical_fsh_match_1e6": abs(new["shared_fraction"] - old["shared_fraction"]) < 1e-6,
                  "canonical_mse_match_1e6": abs(new["test_mse"] - old["test_mse"]) < 1e-6,
              }
              rows.append(row)

              print(f"Replicate {rep}, seed {seed}")
              print("  committed F_sh:", old["shared_fraction"])
              print("  new F_sh:      ", new["shared_fraction"])
              print("  F_sh delta:    ", row["shared_fraction_delta"])
              print("  committed MSE: ", old["test_mse"])
              print("  new MSE:       ", new["test_mse"])
              print()

          out = "analysis/corrected_20260920/task1_reproduction_comparison.csv"
          with open(out, "w", newline="") as f:
              w = csv.DictWriter(f, fieldnames=rows[0].keys())
              w.writeheader()
              w.writerows(rows)
          print("Wrote", out)
          PY

      - name: Run latent usage diagnostic
        run: python scripts/14_latent_usage.py

      - name: Show Task 1 summary
        run: |
          echo "===== REPRODUCTION COMPARISON ====="
          cat analysis/corrected_20260920/task1_reproduction_comparison.csv
          echo
          echo "===== LATENT USAGE SUMMARY ====="
          cat analysis/corrected_20260920/latent_usage_summary.csv
          echo
          echo "===== ACTIVE-UNIT / KL THRESHOLDS ====="
          cat analysis/corrected_20260920/latent_usage_thresholds.json

      - name: Collect replicate outputs
        run: |
          OUT="task1_replicate_${TASK1_REPLICATE}"
          mkdir -p "$OUT"

          {
            echo "TASK1_REPLICATE=$TASK1_REPLICATE"
            uname -a
            lscpu
            python - <<'PY'
          import platform
          import torch, numpy, pandas, scanpy, anndata, sklearn
          print("Platform:", platform.platform())
          print("Python:", platform.python_version())
          print("Torch:", torch.__version__)
          print("NumPy:", numpy.__version__)
          print("Pandas:", pandas.__version__)
          print("Scanpy:", scanpy.__version__)
          print("AnnData:", anndata.__version__)
          print("scikit-learn:", sklearn.__version__)
          PY
          } > "$OUT/hardware_environment.txt"

          cp analysis/corrected_20260920/task1_reproduction_comparison.csv "$OUT/"
          cp analysis/corrected_20260920/latent_usage_per_dimension.csv "$OUT/"
          cp analysis/corrected_20260920/latent_usage_summary.csv "$OUT/"
          cp analysis/corrected_20260920/latent_usage_thresholds.json "$OUT/"
          cp analysis/corrected_20260920/benchmark_gene_universe.csv "$OUT/"

          for seed in 0 1 2; do
            cp "runs/corrected_20260920/full_${seed}_metrics.json" "$OUT/"
            cp "runs/corrected_20260920/full_${seed}_history.csv" "$OUT/"
          done

      - name: Upload replicate outputs
        uses: actions/upload-artifact@v4
        with:
          name: task1-latent-usage-replicate-${{ matrix.replicate }}
          path: task1_replicate_${{ matrix.replicate }}/
          retention-days: 7

  summarize:
    needs: audit
    runs-on: ubuntu-24.04

    steps:
      - name: Download all replicate outputs
        uses: actions/download-artifact@v4
        with:
          pattern: task1-latent-usage-replicate-*
          path: downloaded
          merge-multiple: false

      - name: Summarize replicates
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          root = Path("downloaded")

          def read_all(filename):
              rows = []
              for p in sorted(root.glob(f"*/{filename}")):
                  rep = p.parent.name.rsplit("-", 1)[-1]
                  with p.open() as f:
                      for row in csv.DictReader(f):
                          row = dict(row)
                          row["runner_replicate"] = rep
                          rows.append(row)
              return rows

          repro = read_all("task1_reproduction_comparison.csv")
          latent = read_all("latent_usage_summary.csv")

          def write_csv(path, rows):
              if not rows:
                  raise RuntimeError(f"No rows for {path}")
              fields = list(rows[0].keys())
              with open(path, "w", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=fields)
                  w.writeheader()
                  w.writerows(rows)

          write_csv("task1_reproduction_combined.csv", repro)
          write_csv("task1_latent_usage_combined.csv", latent)

          print("===== COMBINED REPRODUCTION RESULTS =====")
          with open("task1_reproduction_combined.csv") as f:
              print(f.read())

          print("===== COMBINED LATENT USAGE RESULTS =====")
          with open("task1_latent_usage_combined.csv") as f:
              print(f.read())

          print("===== HARDWARE =====")
          for p in sorted(root.glob("*/hardware_environment.txt")):
              print("\n###", p.parent.name)
              print(p.read_text())
          PY

      - name: Upload combined Task 1 summary
        uses: actions/upload-artifact@v4
        with:
          name: task1-combined-summary
          path: |
            task1_reproduction_combined.csv
            task1_latent_usage_combined.csv
          retention-days: 7
