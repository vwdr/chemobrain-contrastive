name: Task 4 paired pseudobulk DESeq2

on:
  workflow_dispatch:

jobs:
  pseudobulk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research.txt
          python -m pip install pydeseq2==0.5.4

      - name: Show versions
        run: |
          python - <<'PY'
          import platform
          import numpy, pandas, anndata
          import pydeseq2
          print("Platform:", platform.platform())
          print("Python:", platform.python_version())
          print("NumPy:", numpy.__version__)
          print("Pandas:", pandas.__version__)
          print("AnnData:", anndata.__version__)
          print("PyDESeq2:", pydeseq2.__version__)
          PY

      - name: Download public inputs
        run: python scripts/05_download_research_data.py

      - name: Recover corrected cohort
        run: python scripts/05_recover_cohort.py

      - name: Verify recovered data hash
        run: |
          ACTUAL=$(sha256sum data/processed/recovered_counts.h5ad | awk '{print $1}')
          EXPECTED="62a5047e74d4ea704f2a10b5b91b35a4836ccefc99186d4c72101db78cbd8ac1"
          echo "Actual:   $ACTUAL"
          echo "Expected: $EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - name: Run paired pseudobulk analysis
        run: python scripts/16_pseudobulk_deseq2.py

      - name: Show Task 4 results
        run: |
          echo "===== DESEQ2 SUMMARY ====="
          cat analysis/corrected_20260920/pseudobulk_deseq2_summary.csv
          echo
          echo "===== ELIGIBILITY ====="
          cat analysis/corrected_20260920/pseudobulk_deseq2_eligibility.csv
          echo
          echo "===== METHOD AGREEMENT ====="
          cat analysis/corrected_20260920/pseudobulk_method_agreement.csv
          echo
          echo "===== DESIGN ====="
          cat analysis/corrected_20260920/pseudobulk_deseq2_design.json

      - name: Sanity checks
        run: |
          python - <<'PY'
          import pandas as pd
          s = pd.read_csv("analysis/corrected_20260920/pseudobulk_deseq2_summary.csv")
          assert len(s) > 0
          assert (s.n_libraries == 6).all()
          assert (s.n_pairs == 3).all()
          assert (s.n_fdr_005 >= 0).all()
          e = pd.read_csv("analysis/corrected_20260920/pseudobulk_deseq2_eligibility.csv")
          assert {"cisplatin_vs_control","cisplatin_GENUS_vs_cisplatin","control_GENUS_vs_control"} <= set(e.contrast)
          print("PASS Task 4 pseudobulk output checks")
          PY

      - name: Collect Task 4 outputs
        if: always()
        run: |
          mkdir -p task4_pseudobulk
          for f in             pseudobulk_library_qc_v2.csv             pseudobulk_deseq2_results.csv.gz             pseudobulk_welch_sensitivity_v2.csv.gz             pseudobulk_deseq2_summary.csv             pseudobulk_deseq2_eligibility.csv             pseudobulk_method_agreement.csv             pseudobulk_dox_library_qc.csv             pseudobulk_dox_descriptive.csv.gz             pseudobulk_deseq2_design.json
          do
            if [ -f "analysis/corrected_20260920/$f" ]; then
              cp "analysis/corrected_20260920/$f" task4_pseudobulk/
            fi
          done

      - name: Upload Task 4 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task4-paired-pseudobulk
          path: task4_pseudobulk/
          retention-days: 7
