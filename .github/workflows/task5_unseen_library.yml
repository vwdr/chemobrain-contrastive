name: Task 5 unseen-library validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/17_unseen_library_validation.py"
      - ".github/workflows/task5_unseen_library.yml"

jobs:
  unseen-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research.txt

      - name: Show environment
        run: |
          python - <<'PY'
          import platform
          import torch, numpy, pandas, scanpy, anndata, sklearn
          print("Platform:", platform.platform())
          print("Machine:", platform.machine())
          print("Python:", platform.python_version())
          print("Torch:", torch.__version__)
          print("NumPy:", numpy.__version__)
          print("Pandas:", pandas.__version__)
          print("Scanpy:", scanpy.__version__)
          print("AnnData:", anndata.__version__)
          print("scikit-learn:", sklearn.__version__)
          PY

      - name: Download public inputs
        run: python scripts/05_download_research_data.py

      - name: Recover corrected cohort
        run: python scripts/05_recover_cohort.py

      - name: Verify recovered data hash
        run: |
          ACTUAL=$(sha256sum data/processed/recovered_counts.h5ad | awk '{print $1}')
          EXPECTED="62a5047e74d4ea704f2a10b5b91b35a4836ccefc99186d4c72101db78cbd8ac1"
          echo "Actual:   $ACTUAL"
          echo "Expected: $EXPECTED"
          test "$ACTUAL" = "$EXPECTED"

      - name: Run leave-one-replicate-pair-out validation
        run: python scripts/17_unseen_library_validation.py

      - name: Show Task 5 results
        run: |
          echo "===== TASK 5 MODEL SUMMARY ====="
          cat analysis/corrected_20260920/task5_unseen_library_model_summary.csv
          echo
          echo "===== TASK 5 FOLD SUMMARY ====="
          cat analysis/corrected_20260920/task5_unseen_library_fold_summary.csv
          echo
          echo "===== TASK 5 DESIGN ====="
          cat analysis/corrected_20260920/task5_unseen_library_design.json

      - name: Sanity checks
        run: |
          python - <<'PY'
          import pandas as pd

          m = pd.read_csv(
              "analysis/corrected_20260920/task5_unseen_library_metrics.csv"
          )
          f = pd.read_csv(
              "analysis/corrected_20260920/task5_unseen_library_fold_summary.csv"
          )
          s = pd.read_csv(
              "analysis/corrected_20260920/task5_unseen_library_model_summary.csv"
          )

          assert set(m["fold"]) == {
              "replicate_1", "replicate_2", "replicate_3"
          }
          assert set(m["mode"]) == {
              "full", "gaussian_vae", "pca32", "training_mean"
          }
          for fold in ("replicate_1", "replicate_2", "replicate_3"):
              q = m[m["fold"] == fold]
              assert len(q[q["mode"] == "full"]) == 3
              assert len(q[q["mode"] == "gaussian_vae"]) == 3
              assert len(q[q["mode"] == "pca32"]) == 1
              assert len(q[q["mode"] == "training_mean"]) == 1

          assert (m["unseen_library_balanced_mse"] > 0).all()
          assert (m["seen_library_validation_balanced_mse"] > 0).all()
          assert len(f) == 12
          assert len(s) == 4
          print("PASS Task 5 unseen-library output checks")
          PY

      - name: Collect Task 5 outputs
        if: always()
        run: |
          mkdir -p task5_unseen_library
          for f in             task5_fold_design.csv             task5_gene_universes.csv             task5_unseen_library_metrics.csv             task5_unseen_library_mse_by_celltype.csv             task5_unseen_library_fold_summary.csv             task5_unseen_library_model_summary.csv             task5_unseen_library_design.json
          do
            if [ -f "analysis/corrected_20260920/$f" ]; then
              cp "analysis/corrected_20260920/$f" task5_unseen_library/
            fi
          done

          for f in runs/corrected_20260920/task5_*_history.csv; do
            if [ -f "$f" ]; then
              cp "$f" task5_unseen_library/
            fi
          done

      - name: Upload Task 5 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task5-unseen-library
          path: task5_unseen_library/
          retention-days: 7
